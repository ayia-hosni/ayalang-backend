name: backend

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: docker/configs/postgres.env.example
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - aya-backend

  backend:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - docker/configs/backend.env.example
      - path: docker/configs/backend.env.local
        required: false
    environment:
      DB_HOST: postgres
    ports:
      - '3333:3000'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - aya-backend

  # Free, self-hosted speech-to-text for recorded answers (no API key/cost).
  whisper:
    image: onerahmet/openai-whisper-asr-webservice:latest
    restart: unless-stopped
    environment:
      ASR_MODEL: base.en
      ASR_ENGINE: faster_whisper
    ports:
      - '9000:9000'
    networks:
      - aya-backend

  # Free, self-hosted grammar checker for the transcribed answer text.
  languagetool:
    image: erikvl87/languagetool:latest
    restart: unless-stopped
    ports:
      - '8010:8010'
    networks:
      - aya-backend

  frontend:
    build:
      context: ../frontend
    restart: unless-stopped
    ports:
      - '4201:8080'
    depends_on:
      - backend
    networks:
      - aya-backend

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    env_file: docker/configs/pgadmin.env.example
    ports:
      - '5050:80'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - aya-backend

networks:
  aya-backend:
    driver: bridge

volumes:
  postgres_data:
  pgadmin_data:
