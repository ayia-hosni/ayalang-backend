# Host nginx vhosts. Install to /etc/nginx/sites-available/interview, symlink into
# sites-enabled, then: certbot --nginx -d interview.ayalab.co -d interview-api.ayalab.co
server {
    listen 80;
    server_name interview.ayalab.co;
    location / {
        proxy_pass http://127.0.0.1:4201;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name interview-api.ayalab.co;
    client_max_body_size 50m;  # audio recording uploads
    location / {
        proxy_pass http://127.0.0.1:3333;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
