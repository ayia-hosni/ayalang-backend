name: Backend CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  NODE_VERSION: '22'
  DB_HOST: localhost
  DB_PORT: 5432
  DB_USERNAME: postgres
  DB_PASSWORD: postgres
  DB_NAME: aya_interviewer_test
  DB_SSL: 'false'
  JWT_SECRET: ci-test-secret
  AWS_REGION: us-east-1
  S3_AUDIO_BUCKET: aya-interviewer-audio-test

jobs:
  test:
    name: Lint, build & test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aya_interviewer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test -- --coverage
      - run: npm run test:e2e

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage
          retention-days: 7

  deploy:
    name: Deploy to server
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency: deploy-backend

    env:
      DEPLOY_DIR: /opt/aya/backend
      # Compose names the image <project>-<service>, i.e. backend-backend.
      IMAGE: backend-backend:latest
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          for v in SSH_HOST SSH_USER SSH_PRIVATE_KEY; do
            [ -n "${!v}" ] || { echo "::error::Secret $v is not set in this repo"; exit 1; }
          done
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          printf 'Host *\n  ServerAliveInterval 30\n  ServerAliveCountMax 10\n' >> ~/.ssh/config

      - name: Sync compose files
        run: |
          ssh $SSH_USER@$SSH_HOST "mkdir -p $DEPLOY_DIR"
          rsync -az --delete \
            --exclude '.git' --exclude '.github' --exclude 'node_modules' \
            --exclude 'dist' --exclude 'coverage' \
            --exclude '.env*' --exclude 'docker/configs/*.local' \
            ./ $SSH_USER@$SSH_HOST:$DEPLOY_DIR/

      # Build on the runner: the VPS can run out of memory during `nest build`.
      - name: Build image
        run: docker build -t "$IMAGE" .

      - name: Ship image & restart
        run: |
          docker save "$IMAGE" | gzip | ssh $SSH_USER@$SSH_HOST "gunzip | docker load"
          ssh $SSH_USER@$SSH_HOST "
            set -e
            cd $DEPLOY_DIR
            docker compose up -d --no-build postgres whisper languagetool backend
            docker image prune -f
          "
